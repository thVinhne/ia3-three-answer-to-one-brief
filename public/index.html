<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogue — session 5</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Do not edit this file. panel.js loads versions/<v>.js for ?v=<v>. -->

  <header class="toolbar">
    <a class="brand" href="/">Shop</a>
    <nav class="menu" aria-label="Version">
      <span class="menu-label">Version</span>
      <a href="?v=a">A</a>
      <a href="?v=b">B</a>
      <a href="?v=c">C</a>
      <a href="/ssr">Server-rendered</a>
    </nav>
  </header>

  <main class="page">
    <h1 class="title">Catalogue <span id="version-label" class="version-label"></span></h1>

    <section class="panel" aria-labelledby="panel-title">
      <h2 class="panel-title" id="panel-title">Test conditions</h2>
      <p class="panel-mode">Server mode: <strong id="mode">unknown</strong></p>
      <div class="mode-buttons" role="group" aria-label="Server mode">
        <button class="button mode" type="button" data-mode="normal">normal</button>
        <button class="button mode" type="button" data-mode="slow">slow</button>
        <button class="button mode" type="button" data-mode="error">error</button>
        <button class="button mode" type="button" data-mode="hang">hang</button>
        <button class="button mode" type="button" data-mode="empty">empty</button>
      </div>
      <p class="panel-hint">The mode changes what <code>GET /api/products</code> does from the next request on. Then reload the page, or press Retry.</p>
    </section>

    <p class="stock-total">Stock value: <output id="stock-value">—</output></p>

    <p class="status" id="status" role="status"></p>
    <p class="retry-area"><button class="button" id="retry" type="button" hidden>Retry</button></p>

    <ul class="catalogue" id="catalogue"></ul>
  </main>

  <footer class="footer">CSC13008 · Session 5 · Shop is a teaching example, not a real store.</footer>

  <!-- One card per product. The version code copies it and fills it in. -->
  <template id="card-template">
    <li class="card" data-id="">
      <h2 class="name"></h2>
      <p class="price"></p>
    </li>
  </template>

  <script type="module" src="panel.js"></script>
</body>
</html>
